# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# kotlin & jetbrains
kotlin = "2.1.21"
jetbrains-annotations = "23.0.0"
exposed = "1.0.0-beta-2"

# configuration
jackson = "2.13.4"  # We need to use this outdated version for now, since minecraft bundles it, with currently no way to overwrite the version at runtime.
                    # A custom parent-last classloader could work, but other plugins would have to be loaded by it to access the api of scafall...
jackson-kotlin = "2.13.4" # We need to use this one, even though it does not officially support the kotlin version. No issue yet...
dataformat-hocon = "2.1-SNAPSHOT"
typesafe-config = "1.3.1"

# minecraft
minecraft = "1.21.7"
parchment = "2025.06.15" # see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
authlib = "1.5.21"
netty = "4.1.74.Final"
fastutil = "8.5.15"

# utils, dependency injection & misc
guava = "31.0.1-jre"
guice = "7.0.0"
commons-lang3 = "3.12.0"
junit-jupiter = "5.8.2"
reflections = "0.10.2"
slf4j-api = "2.0.16"
caffeine = "3.2.0"

# adventure
adventure-api = "4.21.0"
adventure-platform-api = "4.1.0"
adventure-platform-mod-shared = "6.4.0"
adventure-minimessage = "4.10.0"

## Gradle plugins
artifactory = "5+"
foojay-resolver = "0.8.0"
devtools-docker = "a2.0.1.0"
shadow = "9.0.0-rc2"
fabric-loom = "1.11-SNAPSHOT"
resource-factory = "1.3.0"

## Spigot Impl dependencies ##
papermc = "1.21.7-R0.1-SNAPSHOT"
item-nbt-api = "2.13.1"
# external plugins
spigot-plugin-score = "4.24.4.15"
spigot-plugin-executableblocks = "4.24.4.15"
spigot-plugin-denizen = "1.2.5-SNAPSHOT"
spigot-plugin-eco = "6.76.2"
spigot-plugin-itemsadder = "3.1.5"
spigot-plugin-oraxen = "1.152.0"
spigot-plugin-magic = "10.2"
spigot-plugin-mythic = "5.9.5"
spigot-plugin-mythiclib = "1.7.1-SNAPSHOT"
spigot-plugin-mmoitems = "6.10.1-SNAPSHOT"
spigot-plugin-placeholderapi = "2.11.6"
## ##

## Sponge Impl dependencies ##
sponge-gradle = "2.2.0"
sponge-api = "15.0.0-SNAPSHOT"
sponge-impl = "1.21.5-15.0.0-SNAPSHOT"

## Fabric Impl
fabric = "0.128.2+1.21.7"
fabric-loader = "0.16.14"
fabric-kotlin="1.13.4+kotlin.2.2.0"

[libraries]
# Kotlin & Jetbrains dependencies
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }


# Misc (Utils, Datastructurs, etc.)
guice = { module = "com.google.inject:guice", version.ref = "guice" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
reflections = { module = "org.reflections:reflections", version.ref = "reflections" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
netty = { module = "io.netty:netty-all", version.ref = "netty" }
mojang-authlib = { module = "com.mojang:authlib", version.ref = "authlib" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-api" }

# Adventure
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure-api" }
adventure-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure-api" }
adventure-platform-api = { module = "net.kyori:adventure-platform-api", version.ref = "adventure-platform-api" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure-minimessage" }
adventure-platform-shared = { module = "net.kyori:adventure-platform-mod-shared-fabric-repack", version.ref = "adventure-platform-mod-shared" }

# Configs (Jackson + HOCON)
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-dataformat-hocon = { module = "com.wolfyscript:jackson-dataformat-hocon", version.ref = "dataformat-hocon" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson-kotlin" }
hocon = { module = "com.typesafe:config", version.ref = "typesafe-config" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

## Spigot Impl dependencies ##
papermc-paper = { module = "io.papermc.paper:paper-api", version.ref = "papermc" }
tr7zw-item-nbt-api = { module = "de.tr7zw:item-nbt-api-plugin", version.ref = "item-nbt-api" }
adventure-platform-bukkit = { module = "net.kyori:adventure-platform-bukkit", version.ref = "adventure-platform-api" }
# external plugins
spigot-plugin-score = { module = "com.ssomar.score:SCore", version.ref = "spigot-plugin-score" }
spigot-plugin-executableblocks = { module = "com.ssomar.executableblocks:ExecutableBlocks", version.ref = "spigot-plugin-executableblocks" }
spigot-plugin-denizen = { module = "com.denizenscript:denizen", version.ref = "spigot-plugin-denizen" }
spigot-plugin-eco = { module = "com.willfp:eco", version.ref = "spigot-plugin-eco" }
spigot-plugin-itemsadder = { module = "com.github.LoneDev6:api-itemsadder", version.ref = "spigot-plugin-itemsadder" }
spigot-plugin-oraxen = { module = "com.github.oraxen:oraxen", version.ref = "spigot-plugin-oraxen" }
spigot-plugin-magic = { module = "com.elmakers.mine.bukkit:MagicAPI", version.ref = "spigot-plugin-magic" }
spigot-plugin-mythic = { module = "io.lumine:Mythic-Dist", version.ref = "spigot-plugin-mythic" }
spigot-plugin-mythiclib = { module = "io.lumine:MythicLib-dist", version.ref = "spigot-plugin-mythiclib" }
spigot-plugin-mmoitems = { module = "net.Indyuce:MMOItems-API", version.ref = "spigot-plugin-mmoitems" }
spigot-plugin-placeholderapi = { module = "me.clip:placeholderapi", version.ref = "spigot-plugin-placeholderapi" }
## ##

## Sponge Impl dependencies ##
spongepowered-api = { module = "org.spongepowered:spongeapi", version.ref = "sponge-api" }
spongepowered-impl = { module = "org.spongepowered:sponge", version.ref = "sponge-impl" }

## Fabric Impl
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }

[bundles]
jackson = ["jackson-core", "jackson-annotations", "jackson-databind", "jackson-dataformat-hocon"]
exposed = [ "exposed-core", "exposed-jdbc", "exposed-json" ]
adventure = ["adventure-api", "adventure-platform-api", "adventure-text-minimessage"]
spigot-external-plugins = [
    "spigot-plugin-score",
    "spigot-plugin-denizen",
    "spigot-plugin-eco",
    "spigot-plugin-executableblocks",
    "spigot-plugin-itemsadder",
    "spigot-plugin-magic",
    "spigot-plugin-mmoitems",
    "spigot-plugin-mythic",
    "spigot-plugin-mythiclib",
    "spigot-plugin-oraxen",
    "spigot-plugin-placeholderapi",
]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
devtools-docker-run = { id = "com.wolfyscript.devtools.docker.run", version.ref = "devtools-docker" }
devtools-docker-minecraft = { id = "com.wolfyscript.devtools.docker.minecraft_servers", version.ref = "devtools-docker" }
spongepowered-gradle = { id = "org.spongepowered.gradle.plugin", version.ref = "sponge-gradle" }
spongepowered-repository = { id = "org.spongepowered.gradle.repository", version.ref = "sponge-gradle" }
artifactory = { id = "com.jfrog.artifactory", version.ref = "artifactory" }
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
resource-factory-bukkit = { id = "xyz.jpenilla.resource-factory-bukkit-convention", version.ref = "resource-factory" }