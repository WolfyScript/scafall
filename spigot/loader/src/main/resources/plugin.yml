name: scafall
version: '${version}'
main: com.wolfyscript.scafall.spigot.loader.SpigotLoaderPlugin
api-version: 1.21
authors: [ WolfyScript ]
load: STARTUP

libraries:
  - "org.apache.commons:commons-lang3:3.12.0"
  - "${libs.kotlin.reflect.get()}"
  - "${libs.kotlin.stdlib.get()}" # There are other ways to include kotlin on the server (like a separate plugin), but here we just include it.
  - "${libs.jetbrains.annotations.get()}"
  - "${libs.commons.lang3.get()}"
  - "${libs.reflections.get()}"
  - "${libs.adventure.api.get()}"
  - "${libs.adventure.text.minimessage.get()}"
  - "${libs.adventure.platform.bukkit.get()}"
  - "${libs.jackson.databind.get()}"
  - "${libs.guice.get()}"

loadbefore:
  - ChatColor
  - ChatColor2
  - StackableItems
  - DiSky
  - EpicWorldGenerator

softdepend:
  - Magic
  - LWC
  - PlotSquared
  - WorldGuard
  - MythicMobs
  - MMOItems
  - BungeeChat
  - mcMMO
  - Oraxen
  - ItemsAdder
  - PlaceholderAPI
  - eco
  - zAuctionHouseV3
  - SCore
